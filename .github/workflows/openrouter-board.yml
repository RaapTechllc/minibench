# Daily Mode A poll. Live GET only when OPENROUTER_API_KEY is present.
# Without the secret the job succeeds via the committed fixture (no fail-open numbers).
name: OpenRouter Usage Board

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "agentbench/openrouter_data.py"
      - "agentbench/board.py"
      - "agentbench/poll_openrouter.py"
      - "agentbench/data/openrouter_data_fixture.json"
      - ".github/workflows/openrouter-board.yml"

jobs:
  poll:
    name: Poll or fixture snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentbench/requirements-dev.txt
      - name: Install agentbench
        working-directory: agentbench
        run: pip install -r requirements-dev.txt
      - name: Fixture snapshot (always, no secret required)
        run: python -m agentbench.poll_openrouter --fixture --out /tmp/board-fixture.json
      - name: Live poll (skipped without secret)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "No OPENROUTER_API_KEY; fixture path only (not live)."
            exit 0
          fi
          python -m agentbench.poll_openrouter --out /tmp/board-live.json
      - name: Dog-food recommend against fixture
        run: python -m agentbench.recommend --dogfood --task code --budget 5 --max-latency-ms 5000
