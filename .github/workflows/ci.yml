name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minibench
          POSTGRES_PASSWORD: minibench
          POSTGRES_DB: minibench
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U minibench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        env:
          MINIBENCH_TEST_PG_HOST: 127.0.0.1
          MINIBENCH_TEST_PG_PORT: "5438"
        run: pytest

  agentbench:
    name: agentbench (module + drift smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentbench/requirements-dev.txt
      - name: Install deps
        working-directory: agentbench
        run: pip install -r requirements-dev.txt
      - name: Unit tests (offline, no keys)
        working-directory: agentbench
        run: pytest -q
      - name: Dry-run smoke (catches config/task drift)
        run: |
          python -m agentbench.run \
            --config agentbench/presets/moa-v1.yaml \
            --tasks agentbench/tasks/coding-v1.json \
            --trials 2 --dry-run --out /tmp/dryrun.json
      - name: Minibench dry-run smoke (single-model path + suite validity)
        run: |
          python -m agentbench.run \
            --model openrouter/moonshotai/kimi-k2.7-code \
            --tasks agentbench/tasks/minibench-core-v1.json \
            --trials 1 --dry-run --out /tmp/mb-dryrun.json
      - name: Minibench cost budget guard
        run: |
          python -m agentbench.cost_check \
            --tasks agentbench/tasks/minibench-core-v1.json --trials 3
          python -m agentbench.cost_check \
            --tasks agentbench/tasks/minibench-hard-v1.json --trials 3
          python -m agentbench.cost_check \
            --tasks agentbench/tasks/minibench-v2.json --trials 3
          python -m agentbench.cost_check \
            --tasks agentbench/tasks/minibench-pro-v1.json --trials 3 --budget 40
      - name: Minibench hard-suite dry-run smoke
        run: |
          python -m agentbench.run \
            --model openrouter/moonshotai/kimi-k2.7-code \
            --tasks agentbench/tasks/minibench-hard-v1.json \
            --trials 1 --dry-run --out /tmp/mbh-dryrun.json
      - name: Minibench v2-suite dry-run smoke
        run: |
          python -m agentbench.run \
            --model openrouter/moonshotai/kimi-k2.7-code \
            --tasks agentbench/tasks/minibench-v2.json \
            --trials 1 --dry-run --out /tmp/mb2-dryrun.json
      - name: Minibench pro-suite dry-run smoke
        run: |
          python -m agentbench.run \
            --model openrouter/moonshotai/kimi-k2.7-code \
            --tasks agentbench/tasks/minibench-pro-v1.json \
            --trials 1 --dry-run --out /tmp/mbp-dryrun.json
      - name: benchmarks/ preset-drift guard
        run: |
          pip install pyyaml pytest
          pytest -q benchmarks/tests

  cli:
    name: CLI (Python package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI + pytest
        working-directory: cli
        run: |
          pip install -e .
          pip install pytest
      - name: Run tests
        working-directory: cli
        run: pytest

  frontend:
    name: Frontend (Vite build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
