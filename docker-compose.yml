services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minibench
      POSTGRES_USER: minibench
      POSTGRES_PASSWORD: minibench
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibench"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3070:3070"
    environment:
      DATABASE_URL: postgresql+asyncpg://minibench:minibench@db:5432/minibench
      DATABASE_URL_SYNC: postgresql+psycopg2://minibench:minibench@db:5432/minibench
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3071:80"
    depends_on:
      - api

volumes:
  pgdata:
