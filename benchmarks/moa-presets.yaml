# Hermes MoA Benchmark Presets — v2 (Real Data)
# Copy to ~/.hermes/config.yaml (merge moa: section) or use hermes moa configure
#
# All model IDs and pricing verified from published sources (Jul 3, 2026):
# - BFCL V4, llm-stats.com, VentureBeat, GLM-5.2 scorecard, Kimi K2.7 Code, MiniMax M3

moa:
  default_preset: glm-tool-moa
  presets:
    glm-tool-moa:
      enabled: true
      description: "Primary — GLM-5.2 aggregator. Beats Opus 4.8 on Terminal-Bench (81.0 vs 74.6). 40% cost."
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
        - provider: openrouter
          model: x-ai/grok-4.3
      aggregator:
        provider: openrouter
        model: z-ai/glm-5.2
      reference_temperature: 0.7
      aggregator_temperature: 0.4
      reference_max_tokens: 600
      max_tokens: 4096

    kimi-tool-moa:
      enabled: true
      description: "Secondary — Kimi K2.7 Code. MCP Mark 81.1 > Opus 4.8 (76.4). 22% cost."
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
        - provider: openrouter
          model: x-ai/grok-4.3
      aggregator:
        provider: openrouter
        model: kimi/kimi-k2.7-code
      reference_temperature: 0.7
      aggregator_temperature: 0.4
      reference_max_tokens: 600
      max_tokens: 4096

    glm-flash-moa:
      enabled: true
      description: "Budget — GLM-5.2 + MiMo Flash. 22% cost."
      reference_models:
        - provider: openrouter
          model: xiaomi/mimo-v2.5-flash
        - provider: openrouter
          model: deepseek/deepseek-v4-flash
      aggregator:
        provider: openrouter
        model: z-ai/glm-5.2
      reference_temperature: 0.7
      aggregator_temperature: 0.4
      reference_max_tokens: 600
      max_tokens: 4096

    m3-experimental:
      enabled: true
      description: "Experimental — MiniMax M3. 10% cost. 1M context."
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
        - provider: openrouter
          model: x-ai/grok-4.3
      aggregator:
        provider: openrouter
        model: minimax/minimax-m3
      reference_temperature: 0.7
      aggregator_temperature: 0.4
      reference_max_tokens: 600
      max_tokens: 4096
