# Hermes MoA Benchmark Presets
# Copy to ~/.hermes/config.yaml (merge moa: section) or use hermes moa configure

moa:
  default_preset: balanced-hybrid
  presets:
    budget-open:
      enabled: true
      reference_models:
        - provider: openrouter
          model: z-ai/glm-5.2
        - provider: openrouter
          model: qwen/qwen3.7-max
        - provider: openrouter
          model: xiaomi/mimo-v2.5
      aggregator:
        provider: openrouter
        model: deepseek/deepseek-v4-pro
      reference_temperature: 0.7
      aggregator_temperature: 0.4
      reference_max_tokens: 600
      max_tokens: 4096

    balanced-hybrid:
      enabled: true
      reference_models:
        - provider: openrouter
          model: x-ai/grok-4.3
        - provider: openrouter
          model: cursor/composer-2.5
        - provider: openrouter
          model: z-ai/glm-5.2
      aggregator:
        provider: openrouter
        model: openai/gpt-5.5
      reference_temperature: 0.7
      aggregator_temperature: 0.4
      reference_max_tokens: 600
      max_tokens: 4096

    high-quality:
      enabled: true
      reference_models:
        - provider: openrouter
          model: x-ai/grok-4.3
        - provider: openrouter
          model: qwen/qwen3.7-max
        - provider: openrouter
          model: nvidia/nemotron-3-ultra-550b-a55b
      aggregator:
        provider: openrouter
        model: anthropic/claude-opus-4.8
      reference_temperature: 0.7
      aggregator_temperature: 0.4
      reference_max_tokens: 600
      max_tokens: 4096
